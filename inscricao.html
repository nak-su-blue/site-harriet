    <h1>organizações e museus sem fins lucrativos criados em memória de Harriet Bennet:</h1>
    <h2>Gostaria de contribuir para algum?Se sim, inscreva-se abaixo:</h2>
    <form action="requisicao.php" method="post">
        <div>
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" required>
        </div>
        <div>
            <label for="cpf">CPF:</label>
            <input type="text" name="cpf" id="cpf" pattern="\d{3}\.\d{3}\.\d{3}\-\d{2}" placeholder="000.000.000-00" required>
        </div>
        <div>
            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email" required>
        </div>
        <div>
            <label for="contato">Contato:</label>
            <input type="tel" name="contato" id="contato" pattern="\(\d{2}\)\s9\d{4}-\d{4}" placeholder="(00) 90000-0000" required>
        </div>
        <div>
            <input type="checkbox" name="home" id="home" value="sim">
            <label for="home">Home</label>
            
            <input type="checkbox" name="museu" id="museu" value="sim">
            <label for="museu">Museu</label>
            
        </div>
        <div>
            <input type="checkbox" name="contribuir" id="contribuir" value="sim" required>
            <label for="contribuir">Aceito contribuir</label>
        </div>
        <div>
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Desejo receber novidades por e-mail.</label>
        </div>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
